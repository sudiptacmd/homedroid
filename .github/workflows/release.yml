name: Release

# Push a tag like v0.4.1-beta to build signed APKs and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the release for
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Build native binaries
        run: native/build-all.sh arm64-v8a armeabi-v7a x86_64

      # Before the APK: the app carries the hashes of the runtime it may download.
      - name: Build the on-phone AI runtime (llama.cpp)
        run: |
          sudo apt-get install -y ninja-build glslc > /dev/null
          native/build-llama.sh arm64-v8a x86_64

      - name: Build signed APKs
        env:
          HOMEDROID_KEYSTORE_B64: ${{ secrets.HOMEDROID_KEYSTORE_B64 }}
          HOMEDROID_KEYSTORE_PASSWORD: ${{ secrets.HOMEDROID_KEYSTORE_PASSWORD }}
          HOMEDROID_KEY_ALIAS: ${{ secrets.HOMEDROID_KEY_ALIAS }}
          HOMEDROID_KEY_PASSWORD: ${{ secrets.HOMEDROID_KEY_PASSWORD }}
        run: |
          test -n "$HOMEDROID_KEYSTORE_B64" || { echo "signing secrets are missing" >&2; exit 1; }
          echo "$HOMEDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export HOMEDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check dashboard behavior and bundled Go dependencies
        run: |
          node tests/ipcam-dashboard.test.cjs
          node tests/cluster-dashboard.test.cjs
          node tests/mobile-dashboard.test.cjs
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          bash native/security-check.sh

      - name: Collect APKs
        run: |
          version="${TAG#v}"
          mkdir dist
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "dist/homedroid-$version-$abi.apk"
          done
          cp native/out/llama-runtime-*.tar.gz dist/
          (cd dist && sha256sum *.apk *.tar.gz > SHA256SUMS)
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] || notes=/dev/null
          pre=""; case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Homedroid ${TAG#v}" --notes-file "$notes" $pre
          fi
