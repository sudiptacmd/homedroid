name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Cache native sources
        uses: actions/cache@v4
        with:
          path: |
            native/.work/*.tar.*
            ~/go/pkg/mod
          key: native-${{ hashFiles('native/*.sh', 'native/go-security-deps.txt', 'native/sshd/go.sum') }}

      - name: Build native binaries
        run: native/build-all.sh arm64-v8a armeabi-v7a

      - name: Build APKs
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: homedroid-apks
          path: app/build/outputs/apk/release/*.apk
